name: build

on:
  push:
    # Every branch builds, but no tag does: release.yml already builds the
    # full matrix for a tag, so a tag push would otherwise run the same six
    # jobs twice.
    #
    # This must be `branches`, not `tags-ignore`. Defining only one of the
    # two ref kinds suppresses the other entirely, so `tags-ignore: '**'`
    # alone silently stops every branch build. Naming branches and leaving
    # tags undefined is what excludes tags.
    branches: [ '**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

# Supersede in-flight runs for the same ref. Pull request events report
# refs/pull/N/merge rather than the source branch, so key on the head label
# there instead, keeping a fork PR's runs in one group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

jobs:
  # A job skipped by the if below never expands its matrix, so a name using
  # matrix.platform would show up raw in the checks list. Let GitHub derive
  # the name from the job id and the matrix instead, and keep platform the
  # only top-level matrix key so the derived name stays short.
  build:
    runs-on: ${{ matrix.os }}

    # Push covers every branch in this repo, so a same-repo PR would only
    # duplicate a run that already happened. Fork PRs have no such push
    # event here, so they are the only pull_request events worth building.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-x86_64
          - windows-arm64
          - macos-arm64
          - macos-x86_64
          - linux-x86_64
          - linux-arm64
        include:
          # Windows x86_64 — MSYS2 MINGW64 environment
          - platform: windows-x86_64
            os: windows-latest
            arch: x86_64
            artifact_ext: zip
            msys2_system: MINGW64
            msys2_clang_pkg: mingw-w64-x86_64-clang
            msys2_llvm_pkg: mingw-w64-x86_64-llvm
            msys2_bin: C:/msys64/mingw64/bin

          # Windows ARM64 — MSYS2 CLANGARM64 environment
          - platform: windows-arm64
            os: windows-11-arm
            arch: arm64
            artifact_ext: zip
            msys2_system: CLANGARM64
            msys2_clang_pkg: mingw-w64-clang-aarch64-clang
            msys2_llvm_pkg: mingw-w64-clang-aarch64-llvm
            msys2_bin: C:/msys64/clangarm64/bin

          # macOS ARM64 (Apple Silicon)
          - platform: macos-arm64
            os: macos-latest
            arch: arm64
            artifact_ext: tar.gz

          # macOS x86_64 (Intel)
          - platform: macos-x86_64
            os: macos-15-intel
            arch: x86_64
            artifact_ext: tar.gz

          # Linux x86_64
          - platform: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
            artifact_ext: tar.gz

          # Linux ARM64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            artifact_ext: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Windows-specific: Install MSYS2 with Clang for a consistent toolchain.
      # The matrix selects MINGW64 on x86_64 and CLANGARM64 on arm64.
      - name: Install MSYS2 with Clang (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys2_system }}
          update: true
          install: >-
            ${{ matrix.msys2_clang_pkg }}
            ${{ matrix.msys2_llvm_pkg }}
            make
            tar
            zip

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "${{ matrix.msys2_bin }}" >> "$GITHUB_PATH"
          echo "C:/msys64/usr/bin" >> "$GITHUB_PATH"

      # Linux-specific: Install Clang
      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      # macOS already has Clang installed via Xcode Command Line Tools

      # The Windows/non-Windows pairs below differ only in `shell:`. GHA
      # parses `shell:` before matrix substitution, so it can't be driven
      # from a matrix field — hence the explicit duplication.
      - name: Verify toolchain (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          uname -a || true
          make --version || true
          clang --version || true

      - name: Verify toolchain (Non-Windows)
        if: runner.os != 'Windows'
        run: |
          uname -a || true
          make --version || true
          clang --version || true

      - name: Build library (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make clean && make

      - name: Build library (Non-Windows)
        if: runner.os != 'Windows'
        run: make clean && make

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test

      - name: Run tests (Non-Windows)
        if: runner.os != 'Windows'
        run: make test

      # Stage + archive via `make dist`. Layout is defined in the Makefile
      # so it stays in one place.
      - name: Package dist bundle (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make dist PLATFORM=${{ matrix.platform }} ARCHIVE=${{ matrix.artifact_ext }}
          ls -lR dist

      - name: Package dist bundle (Non-Windows)
        if: runner.os != 'Windows'
        run: |
          make dist PLATFORM=${{ matrix.platform }} ARCHIVE=${{ matrix.artifact_ext }}
          ls -lR dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libjcccol-${{ matrix.platform }}
          # Version segment of the filename comes from VERSION via make dist;
          # wildcard avoids duplicating it across workflow and Makefile.
          path: dist/libjcccol-*-${{ matrix.platform }}.${{ matrix.artifact_ext }}
          if-no-files-found: error
          retention-days: 30
